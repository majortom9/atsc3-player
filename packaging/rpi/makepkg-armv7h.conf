source /etc/makepkg.conf
# 32-bit ARM Linux (glibc) cross toolchain: ARM GNU Toolchain 15.2
# arm-none-linux-gnueabihf, unpacked in /opt. (arm-none-eabi is bare-metal and
# can't build Linux userspace.)
export PATH=/opt/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-linux-gnueabihf/bin:$PATH
CARCH="armv7h"
CHOST="arm-none-linux-gnueabihf"
MAKEFLAGS="-j$(nproc)"
